{% raw %}
<div v-if="screen.type == 'qr'" class="obs-intermission-qr-screen">
  <div class="obs-intermission-qr-screen-header" v-if="screen.header">{{ screen.header }}</div>
  <div class="obs-intermission-qr-screen-header2" v-if="screen.header2">{{ screen.header2 }}</div>
  <div class="obs-intermission-qr-screen-header3" v-if="screen.header3">{{ screen.header3 }}</div>
  <div class="obs-intermission-qr-screen-qr">
    <img :src="screen.qr_url" />
  </div>
</div>
{% endraw %}
